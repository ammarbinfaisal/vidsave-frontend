app = "vidsave-web"
primary_region = "iad"

[build]
  [build.args]
    NEXT_PUBLIC_API_URL = "https://vidsave-api.fly.dev"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # Keep one warm so the homepage never pays a cold start.
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
